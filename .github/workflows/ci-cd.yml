name: Django CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

env:
  PYTHON_VERSION: "3.13"
  APP_IMAGE: ${{ secrets.DOCKER_HUB_USERNAME }}/habit-tracker:${{ github.sha }}

jobs:
  lint_and_tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: [ "5432:5432" ]
        options: >-
          --health-cmd="pg_isready -U postgres -d test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: [ "6379:6379" ]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: flake8 .

      - name: Run migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test
          DATABASE_NAME: test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: python manage.py migrate

      - name: Tests
        env:
          DJANGO_SETTINGS_MODULE: config.settings
          SECRET_KEY: test
          DATABASE_NAME: test
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          REDIS_URL: redis://localhost:6379/1
        run: python manage.py test

  docker_build:
    runs-on: ubuntu-latest
    needs: lint_and_tests

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build Docker image
        run: docker build -t "${APP_IMAGE}" .

      - name: Push Docker image to Docker Hub
        run: docker push "${APP_IMAGE}"

  deploy:
    runs-on: ubuntu-latest
    needs: docker_build

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Prepare remote dir
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p ${{ secrets.REMOTE_PATH }}/pp_course
            sudo chown -R ${{ secrets.SSH_USER }}:${{ secrets.SSH_USER }} ${{ secrets.REMOTE_PATH }}/pp_course
            sudo chmod -R u+rwx,go+rx ${{ secrets.REMOTE_PATH }}/pp_course

      - name: Verify ENV_FILE presence
        run: |
          if [ -z "$ENV_FILE" ]; then
            echo "ERROR: ENV_FILE is empty or not provided"
            exit 1
          else
            echo "ENV_FILE is present (length: ${#ENV_FILE} bytes)"
          fi
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}

      - name: Copy compose + nginx to server
        uses: appleboy/scp-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "DockerFile,docker-compose.yml,nginx"
          target: "${{ secrets.REMOTE_PATH }}/pp_course"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.4
        env:
          APP_IMAGE: ${{ env.APP_IMAGE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.REMOTE_PATH }}/pp_course"
            
            cat > .env <<'EOF'
            ${{ secrets.ENV_FILE }}
            EOF
            chmod 600 .env
            
            echo "APP_IMAGE=${APP_IMAGE}" > .deploy.env

            docker compose pull || true
            APP_IMAGE=${APP_IMAGE} docker compose --env-file .deploy.env up -d --build
            
            sleep 5
            docker compose ps
            
            docker compose logs --no-color --tail 80 db || true
            
            docker compose exec -T web python manage.py migrate --noinput || (sleep 5 && docker compose exec -T web python manage.py migrate --noinput) || true
            docker compose exec -T web python manage.py collectstatic -c --noinput || (sleep 5 && docker compose exec -T web python manage.py collectstatic -c --noinput) || true

      - name: Final check — list running containers
        uses: appleboy/ssh-action@v1.2.4
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.REMOTE_PATH }}/pp_course || exit 1
            docker compose ps
